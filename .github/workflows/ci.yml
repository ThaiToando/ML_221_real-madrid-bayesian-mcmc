name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (no Manim, no browser tools)
        run: |
          grep -v -E '^(manim|playwright|kaleido)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Deck builds from the committed tables
        run: python -c "import src.slides as S; S.slide_list(S.numbers()); print('slides OK')"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t real-madrid-probability .
      - name: Serve the deck and fetch it
        run: |
          docker run -d -p 8000:8000 --name deck real-madrid-probability
          sleep 3
          curl -sf http://localhost:8000/ | grep -q "Does money buy wins"
